<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Career Intelligence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-page">
    <div class="login-container">
        <h2 class="text-center mb-4">📝 Create Account</h2>
        
        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label fw-medium">Full Name</label>
                <input 
                    type="text" 
                    name="fullname" 
                    class="form-control" 
                    placeholder="Enter your full name" 
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label fw-medium">Email Address</label>
                <input 
                    type="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="name@example.com" 
                    required
                >
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-medium">Password</label>
                <div class="input-group">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Create password" 
                        required
                    >
                    <button 
                        class="btn btn-outline-secondary bg-white text-dark" 
                        type="button" 
                        onclick="togglePasswordVisibility('password', 'toggle-icon-1')"
                        style="border-top-right-radius: 12px; border-bottom-right-radius: 12px;"
                    >
                        <i id="toggle-icon-1" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-medium">Confirm Password</label>
                <div class="input-group">
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control" 
                        placeholder="Confirm password" 
                        required
                    >
                    <button 
                        class="btn btn-outline-secondary bg-white text-dark" 
                        type="button" 
                        onclick="togglePasswordVisibility('confirm_password', 'toggle-icon-2')"
                        style="border-top-right-radius: 12px; border-bottom-right-radius: 12px;"
                    >
                        <i id="toggle-icon-2" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold mb-3">
                Register Account
            </button>
        </form>
        
        <hr class="my-4">
        
        <div class="text-center">
            <span class="opacity-75">Already have an account?</span> 
            <a href="/login" class="fw-bold ms-1 text-white text-decoration-none">Login Here</a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(fieldId, iconId) {
    const passwordField = document.getElementById(fieldId);
    const toggleIcon = document.getElementById(iconId);
    
    if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleIcon.classList.remove("bi-eye");
        toggleIcon.classList.add("bi-eye-slash");
    } else {
        passwordField.type = "password";
        toggleIcon.classList.remove("bi-eye-slash");
        toggleIcon.classList.add("bi-eye");
    }
}
</script>

<script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>

</body>
</html>
