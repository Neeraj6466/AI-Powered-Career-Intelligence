<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback & Bugs - CareerAI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #111827;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
        }

        .back {
            text-decoration: none;
            background: #4f46e5;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-btn:hover {
            background: #4338ca;
        }

        .info {
            background: #eef2ff;
            color: #3730a3;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>💬 Feedback & Bugs</h1>

        <a href="{{ url_for('dashboard') }}"
           class="back">

            ← Dashboard

        </a>

    </div>


    <!-- INFORMATION -->

    <div class="info">

        💡 Your feedback helps us improve the AI Career
        Intelligence platform. You can report a technical
        problem or share your suggestions.

    </div>


    <!-- FEEDBACK FORM -->

    <div class="card">

        <h2>📝 Submit Feedback</h2>

        <form method="POST">


            <div class="form-group">

                <label>
                    Type
                </label>

                <select name="type" required>

                    <option value="">
                        Select Type
                    </option>

                    <option value="Feedback">
                        💡 Feedback
                    </option>

                    <option value="Bug">
                        🐛 Bug Report
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Message
                </label>

                <textarea
                    name="message"
                    placeholder="Describe your feedback or issue..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn">

                📤 Submit

            </button>

        </form>

    </div>


</div>

</body>

</html>
