<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Resume Preview</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.resume{
    max-width:850px;
    margin:30px auto;
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    color:#0d6efd;
}

hr{
    border:1px solid #ddd;
}

</style>

</head>

<body>

<div class="resume">

<h2>{{ data.name }}</h2>

<p>
<strong>Email:</strong> {{ data.email }}
</p>

<p>
<strong>Phone:</strong> {{ data.phone }}
</p>

<p>
<strong>Address:</strong> {{ data.address }}
</p>

<hr>

<h4>🎓 Education</h4>

<p>{{ data.education }}</p>

<hr>

<h4>💼 Experience</h4>

<p>{{ data.experience }}</p>

<hr>

<h4>🛠 Skills</h4>

<p>{{ data.skills }}</p>

<hr>

<h4>📂 Projects</h4>

<p>{{ data.projects }}</p>

<hr>

<button
onclick="window.print()"
class="btn btn-success">

Download Resume (PDF)

</button>

</div>

</body>

</html>
