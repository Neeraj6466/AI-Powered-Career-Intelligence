<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial,sans-serif;
        }

        .container{
            width:90%;
            margin:40px auto;
        }

        h1{
            text-align:center;
            color:#1f3c88;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#1f3c88;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f8f8f8;
        }

        .back-btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 25px;
            background:#1f3c88;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        .back-btn:hover{
            background:#16306d;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>📂 Resume History</h1>

        <table>

            <tr>

                <th>Filename</th>

                <th>Resume Score</th>

                <th>Career</th>

                <th>Salary</th>

                <th>Upload Date</th>

            </tr>

            {% if history %}

                {% for row in history %}

                <tr>

                    <td>{{ row[0] }}</td>

                    <td>{{ row[1] }}/100</td>

                    <td>{{ row[2] }}</td>

                    <td>{{ row[3] }}</td>

                    <td>{{ row[4] }}</td>

                </tr>

                {% endfor %}

            {% else %}

                <tr>

                    <td colspan="5">

                        No resume history found.

                    </td>

                </tr>

            {% endif %}

        </table>

        <div style="text-align:center;">

            <a href="/dashboard" class="back-btn">

                ⬅ Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
