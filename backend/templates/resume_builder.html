<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}
.container{
    max-width:800px;
}
.card{
    margin-top:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}
</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center mb-4">
📄 Resume Builder
</h2>

<form method="POST" action="{{ url_for('resume_builder') }}">

<div class="mb-3">
<label>Full Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" class="form-control" required>
</div>

<div class="mb-3">
<label>Address</label>
<input type="text" name="address" class="form-control">
</div>

<div class="mb-3">
<label>Education</label>
<textarea name="education" class="form-control" rows="3"></textarea>
</div>

<div class="mb-3">
<label>Experience</label>
<textarea name="experience" class="form-control" rows="3"></textarea>
</div>

<div class="mb-3">
<label>Skills</label>
<textarea name="skills" class="form-control" rows="3"></textarea>
</div>

<div class="mb-3">
<label>Projects</label>
<textarea name="projects" class="form-control" rows="3"></textarea>
</div>

<button class="btn btn-primary w-100">
Generate Resume
</button>

</form>

</div>

</div>

</body>
</html>
