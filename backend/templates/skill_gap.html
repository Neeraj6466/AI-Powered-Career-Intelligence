<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Gap Analysis</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}
.container{
    max-width:700px;
}
.card{
    margin-top:50px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}
</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center mb-4">
Skill Gap Analysis
</h2>

<form method="POST"
      action="{{ url_for('skill_gap') }}"
      enctype="multipart/form-data">

<div class="mb-3">
<label>Upload Resume</label>

<input
type="file"
name="resume"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Select Career</label>

<select
name="career"
class="form-select"
required>

<option value="">Choose Career</option>

<option>AI / Machine Learning Engineer</option>

<option>Python Backend Developer</option>

<option>Frontend Developer</option>

<option>Data Analyst</option>

<option>Python Developer</option>

</select>

</div>

<button class="btn btn-success w-100">

Analyze Skill Gap

</button>

</form>

</div>

</div>

</body>
</html>
