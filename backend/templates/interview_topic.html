<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f7fa;
}

.container{
    max-width:1000px;
}

.card{
    margin-top:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}
</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">
    {{ title }}
</h2>

<!-- Questions Loop Start -->
{% for q in questions %}

<div class="card">
    <div class="card-body">
        <h5>
            Question {{ loop.index }}
        </h5>
        <p>
            {{ q.question }}
        </p>

        <button class="btn btn-primary"
                data-bs-toggle="collapse"
                data-bs-target="#answer{{loop.index}}">
            Show Answer
        </button>

        <div id="answer{{loop.index}}" class="collapse mt-3">
            <div class="alert alert-success">
                {{ q.answer }}
            </div>
        </div>

    </div>
</div>

{% endfor %}
<!-- Questions Loop End -->

<hr class="mt-5">

<h3 class="mb-4 text-primary">
    🌐 Learn More Resources
</h3>

<div class="row">

<!-- Resources Loop Start -->
{% for site in resources %}

<div class="col-md-6">
    <div class="card shadow mb-3">
        <div class="card-body">
            <h5>📘 {{ site.name }}</h5>
            <p>{{ site.desc }}</p>
            <a href="{{ site.url }}"
               target="_blank"
               class="btn btn-primary">
                Open Website
            </a>
        </div>
    </div>
</div>

{% endfor %}
<!-- Resources Loop End -->

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
