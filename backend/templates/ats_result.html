<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS Resume Analysis Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}
.container{
    max-width:900px;
}
.card{
    margin-top:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}
.progress{
    height:30px;
}
</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center mb-4">ATS Resume Analysis Result</h2>

<h4>🎯 Match Percentage</h4>

<div class="progress mb-4">
    <div class="progress-bar bg-success"
         style="width: {{ match_percentage }}%">
        {{ match_percentage }}%
    </div>
</div>

<hr>

<h4>✅ Matching Skills</h4>

<ul>
{% for skill in matching_skills %}
<li>{{ skill }}</li>
{% endfor %}
</ul>

<hr>

<h4>❌ Missing Skills</h4>

<ul>
{% for skill in missing_skills %}
<li>{{ skill }}</li>
{% endfor %}
</ul>

</div>

</div>

</body>
</html>
