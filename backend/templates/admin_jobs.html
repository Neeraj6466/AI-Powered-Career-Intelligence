<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Management - Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #111827;
        }

        .back {
            text-decoration: none;
            background: #4f46e5;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f9fafb;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            color: #6b7280;
        }

        .actions {
            white-space: nowrap;
        }

        @media (max-width: 800px) {

            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            💼 Job Management
        </h1>

        <a
            href="{{ url_for('admin_dashboard') }}"
            class="back"
        >
            ← Admin Dashboard
        </a>

    </div>


    <!-- ADD JOB -->

    <div class="card">

        <h2>
            ➕ Add New Job
        </h2>


        <form method="POST">


            <div class="form-group">

                <label>
                    Job Title
                </label>

                <input
                    type="text"
                    name="title"
                    placeholder="Example: Python Developer"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Company
                </label>

                <input
                    type="text"
                    name="company"
                    placeholder="Example: ABC Technologies"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="Example: Hyderabad"
                >

            </div>


            <div class="form-group">

                <label>
                    Required Skills
                </label>

                <input
                    type="text"
                    name="skills"
                    placeholder="Python, Flask, SQL, Git"
                >

            </div>


            <div class="form-group">

                <label>
                    Job Description
                </label>

                <textarea
                    name="description"
                    placeholder="Enter job description..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="add-btn"
            >
                Add Job
            </button>


        </form>

    </div>


    <!-- JOB LIST -->

    <div class="card">

        <h2>
            📋 Job Postings
        </h2>


        {% if jobs %}

        <table>

            <thead>

                <tr>

                    <th>
                        Title
                    </th>

                    <th>
                        Company
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Skills
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody>

            {% for job in jobs %}

                <tr>

                    <!-- JOB TITLE -->

                    <td>
                        {{ job[1] }}
                    </td>


                    <!-- COMPANY -->

                    <td>
                        {{ job[2] }}
                    </td>


                    <!-- LOCATION -->

                    <td>
                        {{ job[3] }}
                    </td>


                    <!-- SKILLS -->

                    <td>
                        {{ job[5] }}
                    </td>


                    <!-- DELETE -->

                    <td class="actions">

                        <a
    href="{{ url_for('edit_admin_job', job_id=job[0]) }}"
    style="
        background:#4f46e5;
        color:white;
        padding:8px 14px;
        border-radius:6px;
        text-decoration:none;
        margin-right:6px;
        display:inline-block;
    "
>
    ✏️ Edit
</a>

                        <form
                            action="{{ url_for('delete_admin_job', job_id=job[0]) }}"
                            method="POST"
                            onsubmit="return confirm('Are you sure you want to delete this job?');"
                            style="display:inline;"
                        >

                            <button
                                type="submit"
                                class="delete-btn"
                            >
                                🗑️ Delete
                            </button>

                        </form>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>


        {% else %}

        <p class="empty">
            No job postings available.
        </p>

        {% endif %}


    </div>


</div>

</body>

</html>
