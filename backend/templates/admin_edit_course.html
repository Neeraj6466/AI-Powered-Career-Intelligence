<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Course - Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #111827;
        }

        .back {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .update-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 7px;
        }

        .course-id {
            color: #6b7280;
            margin-bottom: 25px;
        }

    </style>

</head>


<body>

<div class="container">


    <div class="header">

        <h1>
            ✏️ Edit Course
        </h1>

        <a
            href="{{ url_for('admin_courses') }}"
            class="back"
        >
            ← Back to Courses
        </a>

    </div>


    <div class="card">

        <p class="course-id">
            Course ID: {{ course[0] }}
        </p>


        <form
            method="POST"
            action="{{ url_for('edit_admin_course', course_id=course[0]) }}"
        >


            <div class="form-group">

                <label>
                    Course Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ course[1] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Platform
                </label>

                <input
                    type="text"
                    name="platform"
                    value="{{ course[2] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    name="category"
                    value="{{ course[3] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Course URL
                </label>

                <input
                    type="url"
                    name="url"
                    value="{{ course[4] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                >{{ course[5] or '' }}</textarea>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn"
                >
                    🔄 Update Course
                </button>


                <a
                    href="{{ url_for('admin_courses') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>


</div>

</body>

</html>
