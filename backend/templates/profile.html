<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 80%;
            margin: 40px auto;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
        }
        h1 {
            color: #1f3c88;
            text-align: center;
            margin-bottom: 30px;
        }
        .button-group {
            margin-top: 30px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background: #1f3c88;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #16306d;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #218838;
        }
        
        /* Form Styles */
        .mb-3 {
            margin-bottom: 15px;
        }
        .mb-4 {
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            color: #1f3c88;
            display: block;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .form-control[readonly], .form-control[disabled] {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        .mt-4 {
            margin-top: 1.5rem;
        }

        /* Layout Styles */
        .text-center {
            text-align: center;
        }
        .rounded-circle {
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1f3c88;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: -10px;
        }
        .col-md-6 {
            flex: 0 0 calc(50% - 20px);
            margin: 10px;
            box-sizing: border-box;
        }
        .col-12 {
            flex: 0 0 calc(100% - 20px);
            margin: 10px;
            box-sizing: border-box;
        }
        .inner-card {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 30px;
        }
        
        /* Dynamic Card Styles */
        .education-card {
            background: #fafafa;
        }
        .border {
            border: 1px solid #ccc;
        }
        .rounded {
            border-radius: 8px;
        }
        .p-3 {
            padding: 15px;
        }
        .mb-2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>👤 User Profile</h1>

        <div style="text-align: right; margin-bottom: 20px;">
            <button type="button" id="editBtn" class="btn">✏️ Edit Profile</button>
        </div>

        <form id="profileForm" method="POST" action="/profile" enctype="multipart/form-data">
            
            <div class="inner-card">
                <h3 class="mb-4" style="color: #1f3c88; margin-top: 0;">👤 Personal Information</h3>
                
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/default-profile.png') }}" id="profilePreview" class="rounded-circle" width="140" height="140" alt="Profile Picture">
                    <br><br>
                    <input type="file" id="profileImage" name="profileImage" accept="image/*" class="form-control" style="width: 50%; margin: 0 auto;" disabled>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Full Name</label>
                        <input type="text" name="fullname" class="form-control" value="{{ user[0] if user else '' }}" placeholder="Enter Full Name" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user[1] if user else '' }}" placeholder="Enter Email" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ user[2] if user else '' }}" placeholder="Enter Mobile Number" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Date of Birth</label>
                        <input type="date" name="dob" class="form-control" value="{{ user[3] if user else '' }}" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Gender</label>
                        <select name="gender" class="form-control" disabled>
                            <option value="">Select Gender</option>
                            <option value="Male" {% if user and user[4] == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if user and user[4] == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if user and user[4] == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Country</label>
                        <input type="text" name="country" class="form-control" value="{{ user[8] if user else '' }}" placeholder="India" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>State</label>
                        <input type="text" name="state" class="form-control" value="{{ user[7] if user else '' }}" placeholder="Andhra Pradesh" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>City</label>
                        <input type="text" name="city" class="form-control" value="{{ user[6] if user else '' }}" placeholder="Visakhapatnam" readonly>
                    </div>
                    <div class="col-12 mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control" rows="3" placeholder="Enter Address" readonly>{{ user[5] if user else '' }}</textarea>
                    </div>
                </div>
            </div>

            <h4 class="mt-4">🎓 Education Details</h4>
<hr>
<div id="educationContainer">
    {% if education %}
        {% for edu in education %}
        <div class="education-card border rounded p-3 mb-3" style="background: #f9f9f9;">
            <input type="text" name="college[]" value="{{ edu[0] }}" class="form-control mb-2" placeholder="College Name" readonly>
            <input type="text" name="degree[]" value="{{ edu[1] }}" class="form-control mb-2" placeholder="Degree" readonly>
            <input type="text" name="branch[]" value="{{ edu[2] }}" class="form-control mb-2" placeholder="Branch" readonly>
            <input type="text" name="cgpa[]" value="{{ edu[3] }}" class="form-control mb-2" placeholder="CGPA" readonly>
            <input type="text" name="start_year[]" value="{{ edu[4] }}" class="form-control mb-2" placeholder="Start Year" readonly>
            <input type="text" name="end_year[]" value="{{ edu[5] }}" class="form-control mb-2" placeholder="End Year" readonly>
        </div>
        {% endfor %}
    {% else %}
        <!-- Default empty card if no data is saved yet -->
        <div class="education-card border rounded p-3 mb-3">
            <input type="text" name="college[]" class="form-control mb-2" placeholder="College Name" readonly>
            <input type="text" name="degree[]" class="form-control mb-2" placeholder="Degree" readonly>
            <input type="text" name="branch[]" class="form-control mb-2" placeholder="Branch" readonly>
            <input type="text" name="cgpa[]" class="form-control mb-2" placeholder="CGPA" readonly>
            <input type="text" name="start_year[]" class="form-control mb-2" placeholder="Start Year" readonly>
            <input type="text" name="end_year[]" class="form-control mb-2" placeholder="End Year" readonly>
        </div>
    {% endif %}
</div>
<button type="button" id="addEducation" class="btn btn-success mb-4" style="display:none;">➕ Add Education</button>

            <h4 class="mt-4">💻 Skills</h4>
            <hr>
            <div class="mb-3">
                <label>Programming Languages</label>
                <input
    type="text"
    name="programming_languages"
    class="form-control"
    value="{{ user[10] if user else '' }}"
    placeholder="Python, Java, C"
    readonly>
            </div>
            <div class="mb-3">
                <label>Web Technologies</label>
                <input
    type="text"
    name="web_technologies"
    class="form-control"
    value="{{ user[11] if user else '' }}"
    placeholder="HTML, CSS, JavaScript, React"
    readonly>
            </div>
            <div class="mb-3">
                <label>Frameworks</label>
                <input
    type="text"
    name="frameworks"
    class="form-control"
    value="{{ user[12] if user else '' }}"
    placeholder="Flask, Bootstrap"
    readonly>
            </div>
            <div class="mb-3">
                <label>Database</label>
                <input
    type="text"
    name="databases"
    class="form-control"
    value="{{ user[13] if user else '' }}"
    placeholder="SQLite, MySQL"
    readonly>
            </div>

            <h4 class="mt-4">📂 Projects</h4>
            <hr>
            <div class="mb-3">
                <label>Project 1</label>
               <input type="text" name="project_name[]" class="form-control" placeholder="AI Career Intelligence Platform" readonly>
            </div>
            <div class="mb-3">
                <label>Project Description</label>
                <textarea
    name="project_description[]"
    class="form-control"
    rows="3"
    placeholder="Describe your project..."
    readonly>{{ user[15] if user else "" }}</textarea>
            </div>
            <div class="mb-3">
                <label>GitHub Repository</label>
                <input
    type="url"
    name="github_repo[]"
    class="form-control"
    value="{{ user[16] if user else '' }}"
    placeholder="https://github.com/username/project"
    readonly>
            </div>
            <div class="mb-3">
                <label>Technologies Used</label>
                <input
    type="text"
    name="tech_used[]"
    class="form-control"
    value="{{ user[17] if user else '' }}"
    placeholder="Python, Flask, HTML, CSS, JavaScript"
    readonly>
           </div>

<button type="button" id="addProject" class="btn btn-success" style="display:none;">
    ➕ Add Project
</button>

<h4 class="mt-4">📜 Additional Details</h4>
            <hr>
            <div class="mb-3">
                <label>Certifications</label>
                <textarea
    name="certifications"
    class="form-control"
    rows="2"
    placeholder="NPTEL, Coursera..."
    readonly>{{ user[18] if user else '' }}</textarea>
            </div>
            <div class="mb-3">
                <label>Work Experience</label>
                <textarea
    name="work_experience"
    class="form-control"
    rows="2"
    placeholder="Internships"
    readonly>{{ user[19] if user else '' }}</textarea>
            </div>
            <div class="mb-3">
                <label>Career Interest</label>
                <input
    type="text"
    name="career_interest"
    class="form-control"
    value="{{ user[20] if user else '' }}"
    placeholder="Artificial Intelligence"
    readonly>
            </div>

            <div style="display: none;" id="saveSection">
                <button type="submit" class="btn btn-success">💾 Save Profile</button>
            </div>
        </form>

        <div class="button-group">
            <a href="/dashboard" class="btn">🏠 Dashboard</a>
            <a href="/history" class="btn">📂 Resume History</a>
            <a href="/logout" class="btn">🚪 Logout</a>
        </div>
    </div>
</div>

<script>
    // Handle "Edit Profile" Button Toggle
    const editBtn = document.getElementById("editBtn");
    const saveSection = document.getElementById("saveSection");
    const addEducationBtn = document.getElementById("addEducation");
    const addProjectBtn = document.getElementById("addProject");

    editBtn.addEventListener("click", function () {
        // Remove readonly from text inputs & textareas
        const inputs = document.querySelectorAll("#profileForm input, #profileForm textarea");
        inputs.forEach(input => input.removeAttribute("readonly"));
        
        // Remove disabled from select and file inputs
        const disabledInputs = document.querySelectorAll("#profileForm select, #profileForm input[type='file']");
        disabledInputs.forEach(input => input.removeAttribute("disabled"));

        saveSection.style.display = "block";
        addEducationBtn.style.display = "inline-block";
        addProjectBtn.style.display = "inline-block";
        editBtn.style.display = "none";
    });

    // Profile Image Preview
    const profileImage = document.getElementById("profileImage");
    const profilePreview = document.getElementById("profilePreview");

    profileImage.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                profilePreview.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // Dynamic Add Education
const educationContainer = document.getElementById("educationContainer");

addEducationBtn.addEventListener("click", function () {
    educationContainer.insertAdjacentHTML("beforeend", `
        <div class="education-card border rounded p-3 mb-3">
            <input type="text" name="college[]" class="form-control mb-2" placeholder="College Name">
            <input type="text" name="degree[]" class="form-control mb-2" placeholder="Degree">
            <input type="text" name="branch[]" class="form-control mb-2" placeholder="Branch">
            <input type="text" name="cgpa[]" class="form-control mb-2" placeholder="CGPA">
            <input type="text" name="start_year[]" class="form-control mb-2" placeholder="Start Year">
            <input type="text" name="end_year[]" class="form-control mb-2" placeholder="End Year">

            <button type="button" class="btn btn-danger removeEducation">
                Remove
            </button>
        </div>
    `);
});


addProjectBtn.addEventListener("click", function () {

    const project = document.createElement("div");

    project.innerHTML = `
        <h5>New Project</h5>

        <input type="text" class="form-control mb-2" placeholder="Project Name">

        <textarea class="form-control mb-2" placeholder="Project Description"></textarea>

        <button type="button" class="btn btn-danger">❌ Remove Project</button>
    `;

    addProjectBtn.before(project);

});


// Handle Removing Education
document.addEventListener("click", function (e) {
    if (e.target.classList.contains("removeEducation")) {
        e.target.parentElement.remove();
    }
});
</script>
</body>
</html>
