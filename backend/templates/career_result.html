<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Recommendation Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}
.container{
    max-width:900px;
}
.card{
    margin-top:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}
.badge{
    margin:4px;
    padding:10px;
    font-size:15px;
}
</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center mb-4">
🎯 AI Career Recommendation
</h2>

<h4>👨‍💼 Recommended Career</h4>

<div class="alert alert-success">
<h4>{{ career }}</h4>
</div>

<hr>

<h4>💰 Expected Salary</h4>

<div class="alert alert-warning">
<h5>{{ salary }}</h5>
</div>

<hr>

<h4>🛠 Your Skills</h4>

{% for skill in skills %}
<span class="badge bg-success">{{ skill }}</span>
{% endfor %}

<hr>

<h4>🤖 AI Career Analysis</h4>

<div class="alert alert-info">

<pre style="white-space: pre-wrap;">{{ ai_analysis }}</pre>

</div>

</div>

</div>

</body>
</html>
