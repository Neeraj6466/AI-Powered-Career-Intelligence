<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">📄 Resume Management</h2>

    {% if resumes %}

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
            <tr>
                <th>Resume</th>
                <th>Upload Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

        {% for resume in resumes %}

            <tr>

                <td>{{ resume[0] }}</td>

                <td>{{ resume[1] }}</td>

                <td>

                    <a href="{{ url_for('view_resume', filename=resume[0]) }}"
   target="_blank"
   class="btn btn-primary btn-sm">
    👁 View
</a>

                    <a href="{{ url_for('download_resume', filename=resume[0]) }}"
   class="btn btn-success btn-sm">
    ⬇ Download
</a>

                    <a href="{{ url_for('replace_resume', filename=resume[0]) }}"
   class="btn btn-warning btn-sm">
    🔄 Replace
</a>

                    <a href="{{ url_for('delete_resume', filename=resume[0]) }}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Are you sure you want to delete this resume?');">
    🗑 Delete
</a>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="alert alert-warning">
        No resumes uploaded yet.
    </div>

    {% endif %}

</div>

</body>
</html>
