<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replace Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .card-box{
            width:450px;
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
            color:#fff;
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            font-weight:bold;
        }

        .form-control{
            padding:12px;
        }

        .btn-upload{
            width:100%;
            margin-top:20px;
            border-radius:10px;
            padding:12px;
            font-size:17px;
            font-weight:bold;
        }

        .back-btn{
            margin-top:20px;
            display:block;
            text-align:center;
            text-decoration:none;
            color:white;
            font-weight:bold;
        }

        .back-btn:hover{
            color:#ffd700;
        }

        .resume-name{
            text-align:center;
            margin-bottom:20px;
            color:#ddd;
            font-size:15px;
        }
    </style>

</head>
<body>

<div class="card-box">

    <h2>🔄 Replace Resume</h2>

    <div class="resume-name">
        Current Resume:<br>
        <strong>{{ filename }}</strong>
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Choose New Resume</label>
            <input
                type="file"
                class="form-control"
                name="resume"
                accept=".pdf,.doc,.docx"
                required>
        </div>

        <button class="btn btn-warning btn-upload">
            Replace Resume
        </button>

    </form>

    <a href="{{ url_for('resume_management') }}" class="back-btn">
        ← Back to Resume Management
    </a>

</div>

</body>
</html>
